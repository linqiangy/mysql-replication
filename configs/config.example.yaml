# bincat 启动配置（静态部分）
# 数据源、规则、sink 存元数据库，由 Web 后台管理。
# 此文件使用公开的本地演示凭据；生产部署使用 config.production.example.yaml。

meta:
  # 元数据库（存数据源/规则/sink/位点/用户/审计），独立于被监听源
  dsn: "bincat:bincat123@tcp(127.0.0.1:33061)/bincat_meta"
  # 数据源密码加密密钥（32 字节，或其 base64）；也可用环境变量 BINCAT_SECRET_KEY
  # secret_key: "0123456789abcdef0123456789abcdef"

server:
  addr: ":8080"
  # 首次启动创建 admin 的密码；支持 ${ENV} 插值
  # 启动前显式设置该变量；仅支持 ${VAR}，不支持 shell 默认值语法。
  initial_admin_password: "${BINCAT_ADMIN_PASSWORD}"
  # JWT 密钥；不配置则每次启动随机（重启后已登录会话失效）
  # jwt_secret: "${BINCAT_JWT_SECRET}"

observability:
  log:
    level: info      # debug / info / warn / error
    format: json     # json / text
  metrics:
    enabled: true
    addr: ":9090"    # /metrics 与 /debug/pprof/*

pipeline_defaults:
  dispatch_queue_size: 256        # 待派发批次数（满则背压阻塞拉取）
  ack_window_size: 64             # 最大在途批次数
  max_tx_rows: 100000             # 单事务行数上限
  on_tx_overflow: skip_with_alert # skip_with_alert / abort
  checkpoint_flush_interval: 2s   # 位点落盘最小间隔
  on_sink_exhausted: block        # block / dlq

shutdown:
  drain_timeout: 30s              # 优雅停机排空在途批次上限
